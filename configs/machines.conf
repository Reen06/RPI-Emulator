# Custom / future Raspberry Pi machine definitions
# Format (pipe-delimited, one per line):
#   key|display|qemu_bin|qemu_machine|cpu|ram|kernel|dtb
#
# Add new models here as QEMU gains support for them.
# The built-in table already covers: pi0, pi1aplus, pi2b, pi3b, pi3bplus, pi3aplus, pi4b, pi5b
#
# Pi 4B unlocks with QEMU 9+  — build: https://www.qemu.org/download/
# Pi 5B unlocks with QEMU 10+ — build: https://www.qemu.org/download/
#   Build ARM targets only (fast): ../configure --target-list=arm-softmmu,aarch64-softmmu
#
# Example — Pi 4B with 8 GB RAM variant:
# pi4b-8g|Pi 4B (8 GB)|qemu-system-aarch64|raspi4b|cortex-a72|8G|kernel8.img|bcm2711-rpi-4-b.dtb
#
# Example — hypothetical Pi 6:
# pi6b|Pi 6B (8 GB)|qemu-system-aarch64|raspi6b|cortex-a78|8G|kernel_rpi6.img|bcm27xx-rpi-6-b.dtb
